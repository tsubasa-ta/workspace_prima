<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f6fb; --card: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
      --primary: #2563eb; --in: #16a34a; --out: #dc2626; --break: #d97706; --back: #0891b2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    .card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .clock { text-align: center; }
    .clock .date { color: var(--muted); font-size: 15px; }
    .clock .time { font-size: 52px; font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
    .who { text-align: center; margin-top: 4px; font-size: 16px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .s-before { background: #f3f4f6; color: #4b5563; }
    .s-working { background: #dcfce7; color: #166534; }
    .s-break { background: #fef3c7; color: #92400e; }
    .s-done { background: #e0e7ff; color: #3730a3; }
    .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .act { border: 0; border-radius: 12px; color: #fff; font-size: 22px; font-weight: 700; padding: 22px 8px; cursor: pointer; }
    .act:disabled { opacity: .5; cursor: wait; }
    .act-出勤 { background: var(--in); } .act-退勤 { background: var(--out); }
    .act-休憩開始 { background: var(--break); } .act-休憩終了 { background: var(--back); }
    input, select { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
    .btn { border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-size: 18px; font-weight: 700;
      padding: 14px; width: 100%; margin-top: 18px; cursor: pointer; }
    .link { background: none; border: 0; color: var(--primary); cursor: pointer; font-size: 14px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .scroll { overflow-x: auto; }
    .warn { color: var(--out); font-weight: 600; }
    .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 15px; display: none; }
    .msg.ok { display: block; background: #dcfce7; color: #166534; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .muted { color: var(--muted); font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prima 勤怠</h1>
    <button id="logoutBtn" class="link hidden" onclick="doLogout()">ログアウト</button>
  </header>

  <div id="msg" class="msg"></div>

  <!-- ログイン -->
  <section id="loginView" class="card hidden">
    <h2>ログイン</h2>
    <label for="staffSel">名前</label>
    <select id="staffSel"><option value="">読み込み中…</option></select>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" class="btn" onclick="doLogin()">ログイン</button>
  </section>

  <!-- 打刻 -->
  <section id="mainView" class="hidden">
    <div class="card clock">
      <div class="date" id="nowDate"></div>
      <div class="time" id="nowTime">--:--:--</div>
      <div class="who"><span id="myName"></span> さん　<span id="stateBadge" class="badge"></span></div>
      <div class="actions" id="actions"></div>
      <label for="note">メモ（任意：遅刻理由・直行直帰など）</label>
      <input id="note" type="text" maxlength="200">
    </div>

    <div class="card">
      <h2>今日の打刻</h2>
      <div id="todayList" class="muted">まだ打刻がありません</div>
    </div>

    <div class="card" id="boardCard">
      <h2>本日の出勤状況（管理者）</h2>
      <div class="scroll"><table id="board"></table></div>
    </div>

    <div class="card">
      <h2 id="monthTitle">今月の勤務</h2>
      <div class="scroll"><table id="monthTable"></table></div>
    </div>
  </section>
</div>

<script>
  var TOKEN_KEY = 'prima_attendance_token';
  var token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function flash(text, ok) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { m.className = 'msg'; }, ok ? 3000 : 6000);
  }
  function saveToken(t) {
    token = t;
    try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function call(fn, args, onOk) {
    var r = google.script.run
      .withSuccessHandler(onOk)
      .withFailureHandler(function (err) {
        var text = (err && err.message) || String(err);
        if (text.indexOf('SESSION_EXPIRED') >= 0) {
          saveToken(null);
          showLogin();
          flash('ログインの有効期限が切れました。もう一度ログインしてください。', false);
        } else {
          flash(text.replace(/^Error:\s*/, ''), false);
        }
        setBusy(false);
      });
    r[fn].apply(r, args);
  }

  // 時計
  function tick() {
    var d = new Date();
    var w = '日月火水木金土'.charAt(d.getDay());
    $('nowDate').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + w + '）';
    $('nowTime').textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(function (n) { return ('0' + n).slice(-2); }).join(':');
  }
  setInterval(tick, 1000); tick();

  // ログイン
  function showLogin() {
    show('mainView', false); show('logoutBtn', false); show('loginView', true);
    $('pin').value = '';
    call('getStaffList', [], function (list) {
      $('staffSel').innerHTML = '<option value="">選択してください</option>' + list.map(function (s) {
        return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>';
      }).join('');
    });
  }
  function doLogin() {
    var id = $('staffSel').value, pin = $('pin').value;
    if (!id || !pin) { flash('名前とPINを入力してください。', false); return; }
    $('loginBtn').disabled = true;
    call('login', [id, pin], function (res) {
      $('loginBtn').disabled = false;
      saveToken(res.token);
      loadStatus();
    });
  }
  function doLogout() {
    call('logout', [token], function () {});
    saveToken(null);
    showLogin();
  }

  // 打刻画面
  function loadStatus() {
    call('getStatus', [token], render);
  }
  function setBusy(on) {
    $('loginBtn').disabled = false;
    Array.prototype.forEach.call(document.querySelectorAll('.act'), function (b) { b.disabled = on; });
  }
  function doPunch(type) {
    if (type === '退勤' && !confirm('退勤を打刻しますか？')) return;
    setBusy(true);
    call('punch', [token, type, $('note').value], function (st) {
      $('note').value = '';
      flash(type + 'を打刻しました（' + st.todayLogs[st.todayLogs.length - 1].time + '）', true);
      render(st);
    });
  }

  function render(st) {
    show('loginView', false); show('mainView', true); show('logoutBtn', true);
    $('myName').textContent = st.me.name;
    var b = $('stateBadge');
    b.textContent = st.stateLabel;
    b.className = 'badge s-' + st.state;

    $('actions').innerHTML = st.nextActions.map(function (a) {
      return '<button class="act act-' + esc(a) + '" data-type="' + esc(a) + '">' + esc(a) + '</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.act'), function (btn) {
      btn.onclick = function () { doPunch(btn.getAttribute('data-type')); };
    });

    $('todayList').innerHTML = st.todayLogs.length
      ? '<table>' + st.todayLogs.map(function (l) {
          return '<tr><td>' + esc(l.time) + '</td><td>' + esc(l.type) + '</td><td class="muted">' + esc(l.note) + '</td></tr>';
        }).join('') + '</table>'
      : 'まだ打刻がありません';

    show('boardCard', !!st.board);
    if (st.board) {
      $('board').innerHTML = '<tr><th>名前</th><th>区分</th><th>状態</th><th>出勤</th><th>退勤</th></tr>' +
        st.board.map(function (r) {
          return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.category) + '</td><td><span class="badge s-' +
            esc(r.state) + '">' + esc(r.stateLabel) + '</span></td><td>' + esc(r.in) + '</td><td>' + esc(r.out) + '</td></tr>';
        }).join('');
    }

    var m = st.month.split('-');
    $('monthTitle').textContent = m[0] + '年' + Number(m[1]) + '月の勤務';
    var totalMin = 0;
    st.monthDays.forEach(function (d) {
      var p = d.work.split(':'); totalMin += Number(p[0]) * 60 + Number(p[1]);
    });
    $('monthTable').innerHTML = '<tr><th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th></th></tr>' +
      st.monthDays.map(function (d) {
        return '<tr><td>' + esc(d.date.slice(5).replace('-', '/')) + '</td><td>' + esc(d.in) + '</td><td>' + esc(d.out) +
          '</td><td>' + esc(d.break) + '</td><td>' + esc(d.work) + '</td><td class="warn">' + esc(d.warning) + '</td></tr>';
      }).join('') +
      '<tr><th colspan="4">合計（' + st.monthDays.length + '日）</th><th>' + Math.floor(totalMin / 60) + ':' +
      ('0' + totalMin % 60).slice(-2) + '</th><th></th></tr>';
    setBusy(false);
  }

  if (token) loadStatus(); else showLogin();
</script>
</body>
</html>

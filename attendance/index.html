<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f6fb; --card: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
      --primary: #2563eb; --in: #16a34a; --out: #dc2626; --break: #d97706; --back: #0891b2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    .card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .clock { text-align: center; }
    .clock .date { color: var(--muted); font-size: 15px; }
    .clock .time { font-size: 52px; font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
    .who { text-align: center; margin-top: 4px; font-size: 16px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .s-before { background: #f3f4f6; color: #4b5563; }
    .s-working { background: #dcfce7; color: #166534; }
    .s-break { background: #fef3c7; color: #92400e; }
    .s-done { background: #e0e7ff; color: #3730a3; }
    .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .act { border: 0; border-radius: 12px; color: #fff; font-size: 22px; font-weight: 700; padding: 22px 8px; cursor: pointer; }
    .act:disabled { opacity: .5; cursor: wait; }
    .act-出勤 { background: var(--in); } .act-退勤 { background: var(--out); }
    .act-休憩開始 { background: var(--break); } .act-休憩終了 { background: var(--back); }
    input, select { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
    .btn { border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-size: 18px; font-weight: 700;
      padding: 14px; width: 100%; margin-top: 18px; cursor: pointer; }
    .link { background: none; border: 0; color: var(--primary); cursor: pointer; font-size: 14px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .scroll { overflow-x: auto; }
    .warn { color: var(--out); font-weight: 600; }
    .panel { border: 2px solid var(--out); border-radius: 12px; padding: 14px; margin-top: 16px; text-align: left; }
    .panel h3 { margin: 0 0 4px; font-size: 17px; }
    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .chip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 4px; font-size: 16px; cursor: pointer; }
    .chip.on { background: var(--out); border-color: var(--out); color: #fff; font-weight: 700; }
    .row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; }
    .btn-sub { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 10px; font-size: 16px; padding: 14px; cursor: pointer; }
    .btn-out { border: 0; background: var(--out); color: #fff; border-radius: 10px; font-size: 18px; font-weight: 700; padding: 14px; cursor: pointer; }
    .btn-out:disabled { opacity: .5; cursor: wait; }
    .req-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .req-form .full { grid-column: 1 / -1; }
    .leave { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 10px 12px;
      background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 4px; }
    .leave b { font-size: 24px; font-variant-numeric: tabular-nums; }
    .req { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; }
    .req:first-child { border-top: 0; }
    .req-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .req-top strong { font-size: 15px; }
    .req-ops { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 4px; }
    .req-ops input { font-size: 15px; padding: 8px 10px; }
    .mini { border: 0; border-radius: 8px; padding: 8px 14px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; }
    .mini:disabled { opacity: .5; cursor: wait; }
    .mini.ok { background: var(--in); } .mini.ng { background: var(--out); }
    .mini.sub { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; }
    .r-申請中 { background: #fef3c7; color: #92400e; } .r-承認 { background: #dcfce7; color: #166534; }
    .r-却下 { background: #fee2e2; color: #991b1b; } .r-取消 { background: #f3f4f6; color: #6b7280; }
    .count { display: inline-block; min-width: 22px; padding: 0 7px; margin-left: 6px; border-radius: 999px;
      background: var(--out); color: #fff; font-size: 13px; text-align: center; }
    @media (max-width: 480px) { .req-form { grid-template-columns: 1fr; } .req-ops { grid-template-columns: 1fr 1fr; } .req-ops input { grid-column: 1 / -1; } }
    .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 15px; display: none; }
    .msg.ok { display: block; background: #dcfce7; color: #166534; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .muted { color: var(--muted); font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prima 勤怠</h1>
    <button id="logoutBtn" class="link hidden" onclick="doLogout()">ログアウト</button>
  </header>

  <div id="msg" class="msg"></div>

  <!-- ログイン -->
  <section id="loginView" class="card hidden">
    <h2>ログイン</h2>
    <label for="staffSel">名前</label>
    <select id="staffSel"><option value="">読み込み中…</option></select>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" class="btn" onclick="doLogin()">ログイン</button>
  </section>

  <!-- 打刻 -->
  <section id="mainView" class="hidden">
    <div class="card clock">
      <div class="date" id="nowDate"></div>
      <div class="time" id="nowTime">--:--:--</div>
      <div class="who"><span id="myName"></span> さん　<span id="stateBadge" class="badge"></span></div>
      <div class="actions" id="actions"></div>
      <div id="outPanel" class="panel hidden">
        <h3>休憩時間を選んでください</h3>
        <div class="muted" id="outInfo"></div>
        <div class="chips" id="breakChips"></div>
        <div class="row2">
          <button class="btn-sub" onclick="closeOut()">戻る</button>
          <button class="btn-out" id="outBtn" onclick="submitOut()">退勤する</button>
        </div>
      </div>
      <label for="note">メモ（任意：遅刻理由・直行直帰など）</label>
      <input id="note" type="text" maxlength="200">
    </div>

    <div class="card hidden" id="approvalCard">
      <h2>承認待ちの申請<span class="count" id="pendingCount"></span></h2>
      <div id="pendingList"></div>
      <details style="margin-top:10px">
        <summary class="muted" style="cursor:pointer">最近処理した申請</summary>
        <div id="recentList"></div>
      </details>
    </div>

    <div class="card">
      <h2>今日の打刻</h2>
      <div id="todayList" class="muted">まだ打刻がありません</div>
    </div>

    <div class="card" id="boardCard">
      <h2>本日の出勤状況（管理者）</h2>
      <div class="scroll"><table id="board"></table></div>
    </div>

    <div class="card">
      <h2>有給休暇・休日出勤の申請</h2>
      <div class="leave" id="leaveBox"></div>
      <div class="req-form">
        <div>
          <label for="reqType">種類</label>
          <select id="reqType"></select>
        </div>
        <div>
          <label for="reqDate">対象日</label>
          <input id="reqDate" type="date">
        </div>
        <div class="full">
          <label for="reqReason">理由（休日出勤は必須）</label>
          <input id="reqReason" type="text" maxlength="200" placeholder="例：私用のため／入試説明会の対応">
        </div>
      </div>
      <button class="btn" id="reqBtn" onclick="doRequest()">申請する</button>
      <h2 style="margin-top:22px">自分の申請</h2>
      <div id="myReqList" class="muted">まだ申請はありません</div>
    </div>

    <div class="card">
      <h2 id="monthTitle">今月の勤務</h2>
      <div class="scroll"><table id="monthTable"></table></div>
    </div>
  </section>
</div>

<script>
  var TOKEN_KEY = 'prima_attendance_token';
  var token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function flash(text, ok) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { m.className = 'msg'; }, ok ? 3000 : 6000);
  }
  function saveToken(t) {
    token = t;
    try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function call(fn, args, onOk) {
    var r = google.script.run
      .withSuccessHandler(function (res) {
        try { onOk(res); } catch (e) {
          flash('画面の表示でエラーが起きました：' + e.message, false);
          setBusy(false);
        }
      })
      .withFailureHandler(function (err) {
        var text = (err && err.message) || String(err);
        if (text.indexOf('SESSION_EXPIRED') >= 0) {
          saveToken(null);
          showLogin();
          flash('ログインの有効期限が切れました。もう一度ログインしてください。', false);
        } else {
          flash(text.replace(/^Error:\s*/, ''), false);
        }
        setBusy(false);
      });
    r[fn].apply(r, args);
  }

  // 時計
  function tick() {
    var d = new Date();
    var w = '日月火水木金土'.charAt(d.getDay());
    $('nowDate').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + w + '）';
    $('nowTime').textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(function (n) { return ('0' + n).slice(-2); }).join(':');
  }
  setInterval(tick, 1000); tick();

  // ログイン
  function showLogin() {
    show('mainView', false); show('logoutBtn', false); show('loginView', true);
    $('pin').value = '';
    call('getStaffList', [], function (list) {
      $('staffSel').innerHTML = '<option value="">選択してください</option>' + list.map(function (s) {
        return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>';
      }).join('');
    });
  }
  function doLogin() {
    var id = $('staffSel').value, pin = $('pin').value;
    if (!id || !pin) { flash('名前とPINを入力してください。', false); return; }
    $('loginBtn').disabled = true;
    call('login', [id, pin], function (res) {
      $('loginBtn').disabled = false;
      saveToken(res.token);
      loadStatus();
    });
  }
  function doLogout() {
    call('logout', [token], function () {});
    saveToken(null);
    showLogin();
  }

  // 打刻画面
  function loadStatus() {
    call('getStatus', [token], render);
  }
  function setBusy(on) {
    $('loginBtn').disabled = false;
    if (!on) {
      $('reqBtn').disabled = false;
      Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (x) { x.disabled = false; });
    }
    Array.prototype.forEach.call(document.querySelectorAll('.act'), function (b) { b.disabled = on; });
    if (!on) $('outBtn').disabled = false;
  }
  var BREAK_OPTIONS = [0, 15, 30, 45, 60, 75, 90, 120];
  var lastStatus = null, breakMin = null;

  // 退勤ボタン → 休憩時間を選ぶパネルを開く
  function openOut() {
    var since = lastStatus && lastStatus.workingSinceMs;
    var mins = since ? Math.max(0, Math.floor((Date.now() - since) / 60000)) : 0;
    // 労働基準法の目安：6時間超は45分、8時間超は60分
    breakMin = mins > 8 * 60 ? 60 : mins > 6 * 60 ? 45 : 0;
    $('outInfo').textContent = since
      ? '出勤から ' + Math.floor(mins / 60) + '時間' + (mins % 60) + '分（休憩を含む）'
      : '';
    renderChips();
    show('actions', false); show('outPanel', true);
  }
  function closeOut() { show('outPanel', false); show('actions', true); }
  function renderChips() {
    $('breakChips').innerHTML = BREAK_OPTIONS.map(function (m) {
      var label = m === 0 ? 'なし' : m + '分';
      return '<button class="chip' + (m === breakMin ? ' on' : '') + '" data-m="' + m + '">' + label + '</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.onclick = function () { breakMin = Number(c.getAttribute('data-m')); renderChips(); };
    });
  }
  function submitOut() {
    $('outBtn').disabled = true;
    doPunch('退勤', breakMin);
  }

  function doPunch(type, brk) {
    if (type === '退勤' && brk == null) { openOut(); return; }
    setBusy(true);
    flash(type + 'を打刻しています…', true);
    call('punch', [token, type, $('note').value, brk == null ? '' : brk], function (st) {
      $('note').value = '';
      render(st);
      var last = st.todayLogs[st.todayLogs.length - 1];
      flash(type + 'を打刻しました' + (last ? '（' + last.time + '）' : ''), true);
    });
  }

  // 申請
  function reqItem(r, opts) {
    var h = '<div class="req"><div class="req-top">' +
      '<span class="badge r-' + esc(r.status) + '">' + esc(r.status) + '</span>' +
      (opts.showName ? '<strong>' + esc(r.name) + '</strong>' : '') +
      '<strong>' + esc(r.dateLabel) + '</strong><span>' + esc(r.type) + '</span>' +
      (opts.showBalance && r.balance != null ? '<span class="muted">有給残 ' + esc(r.balance) + '日</span>' : '') +
      '<span class="muted">申請 ' + esc(r.requestedAt) + '</span></div>' +
      (r.reason ? '<div class="muted">理由：' + esc(r.reason) + '</div>' : '') +
      (r.status !== '申請中' && r.approver ? '<div class="muted">' + esc(r.status) + '：' + esc(r.approver) +
        (r.comment ? '（' + esc(r.comment) + '）' : '') + '</div>' : '');
    if (opts.approve) {
      h += '<div class="req-ops"><input type="text" id="c-' + esc(r.id) + '" maxlength="200" placeholder="コメント（任意）">' +
        '<button class="mini ok" data-act="approve" data-id="' + esc(r.id) + '">承認</button>' +
        '<button class="mini ng" data-act="reject" data-id="' + esc(r.id) + '">却下</button></div>';
    }
    if (opts.cancel && r.status === '申請中') {
      h += '<div><button class="mini sub" data-act="cancel" data-id="' + esc(r.id) + '">取り消す</button></div>';
    }
    return h + '</div>';
  }

  function doRequest() {
    var type = $('reqType').value, date = $('reqDate').value, reason = $('reqReason').value;
    if (!date) { flash('対象日を選んでください。', false); return; }
    $('reqBtn').disabled = true;
    flash('申請しています…', true);
    call('submitRequest', [token, type, date, reason], function (st) {
      $('reqReason').value = '';
      render(st);
      flash(date + ' の' + type + 'を申請しました。', true);
    });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (!b) return;
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
    b.disabled = true;
    if (act === 'cancel') {
      call('cancelRequest', [token, id], function (st) { render(st); flash('申請を取り消しました。', true); });
    } else {
      var c = $('c-' + id) ? $('c-' + id).value : '';
      call('decideRequest', [token, id, act === 'approve', c], function (st) {
        render(st);
        flash(act === 'approve' ? '承認しました。' : '却下しました。', true);
      });
    }
  });

  function renderRequests(st) {
    var sel = $('reqType');
    if (!sel.options.length) {
      sel.innerHTML = st.reqTypes.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
    }
    var l = st.leave;
    $('leaveBox').innerHTML = l
      ? '<span>有給 残り <b>' + esc(l.remaining) + '</b> 日</span>' +
        '<span class="muted">付与 ' + esc(l.granted) + '日・取得 ' + esc(l.used) + '日' +
        (l.pending ? '・申請中 ' + esc(l.pending) + '日' : '') + (l.grantDate ? '（' + esc(l.grantDate) + '〜）' : '') + '</span>'
      : '<span class="muted">有給の付与日数が未登録です（管理者がスタッフシートに入力します）</span>';
    $('myReqList').innerHTML = st.myRequests.length
      ? st.myRequests.map(function (r) { return reqItem(r, { cancel: true }); }).join('')
      : 'まだ申請はありません';

    var a = st.approvals;
    show('approvalCard', !!a);
    if (a) {
      $('pendingCount').textContent = a.pending.length;
      $('pendingCount').style.display = a.pending.length ? '' : 'none';
      $('pendingList').innerHTML = a.pending.length
        ? a.pending.map(function (r) { return reqItem(r, { showName: true, showBalance: true, approve: a.canApprove }); }).join('')
        : '<div class="muted">承認待ちの申請はありません</div>';
      $('recentList').innerHTML = a.recent.length
        ? a.recent.map(function (r) { return reqItem(r, { showName: true }); }).join('')
        : '<div class="muted">まだありません</div>';
    }
    $('reqBtn').disabled = false;
  }

  function render(st) {
    lastStatus = st;
    show('loginView', false); show('mainView', true); show('logoutBtn', true);
    closeOut();
    $('myName').textContent = st.me.name;
    var b = $('stateBadge');
    b.textContent = st.stateLabel;
    b.className = 'badge s-' + st.state;

    $('actions').innerHTML = st.nextActions.map(function (a) {
      return '<button class="act act-' + esc(a) + '" data-type="' + esc(a) + '">' + esc(a) + '</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.act'), function (btn) {
      btn.onclick = function () { doPunch(btn.getAttribute('data-type')); };
    });

    $('todayList').innerHTML = st.todayLogs.length
      ? '<table>' + st.todayLogs.map(function (l) {
          return '<tr><td>' + esc(l.time) + '</td><td>' + esc(l.type) + (l.breakMin ? '（休憩' + l.breakMin + '分）' : '') + '</td><td class="muted">' + esc(l.note) + '</td></tr>';
        }).join('') + '</table>'
      : 'まだ打刻がありません';

    show('boardCard', !!st.board);
    if (st.board) {
      $('board').innerHTML = '<tr><th>名前</th><th>区分</th><th>状態</th><th>出勤</th><th>退勤</th></tr>' +
        st.board.map(function (r) {
          return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.category) + '</td><td><span class="badge s-' +
            esc(r.state) + '">' + esc(r.stateLabel) + '</span></td><td>' + esc(r.in) + '</td><td>' + esc(r.out) + '</td></tr>';
        }).join('');
    }

    var m = st.month.split('-');
    $('monthTitle').textContent = m[0] + '年' + Number(m[1]) + '月の勤務';
    var totalMin = 0;
    st.monthDays.forEach(function (d) {
      var p = d.work.split(':'); totalMin += Number(p[0]) * 60 + Number(p[1]);
    });
    $('monthTable').innerHTML = '<tr><th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th></th></tr>' +
      st.monthDays.map(function (d) {
        return '<tr><td>' + esc(d.date.slice(5).replace('-', '/')) + '</td><td>' + esc(d.in) + '</td><td>' + esc(d.out) +
          '</td><td>' + esc(d.break) + '</td><td>' + esc(d.work) + '</td><td class="warn">' + esc(d.warning) + '</td></tr>';
      }).join('') +
      '<tr><th colspan="4">合計（' + st.monthDays.length + '日）</th><th>' + Math.floor(totalMin / 60) + ':' +
      ('0' + totalMin % 60).slice(-2) + '</th><th></th></tr>';
    renderRequests(st);
    setBusy(false);
  }

  if (token) loadStatus(); else showLogin();
</script>
</body>
</html>
